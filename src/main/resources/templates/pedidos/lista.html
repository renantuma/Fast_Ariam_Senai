<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
  <title>Pedidos — Fast Ariam</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: overlay}"></div>

<header id="topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="topbar-menu-btn" type="button"
            onclick="FastAriam.sidebar.toggle()" aria-label="Abrir menu">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <span class="topbar-title">
      <i class="bi bi-file-earmark-text-fill text-fa-blue" aria-hidden="true"></i>
      Pedidos
    </span>
  </div>
  <div class="topbar-actions">
    <a th:href="@{/pedidos/novo}" class="btn-fa-orange">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      <span class="btn-label">Novo Pedido</span>
    </a>
  </div>
</header>

<main id="main">
  <!-- Feedback -->
  <div th:if="${sucesso}" class="alert alert-success fa-alert mb-3" role="alert"
       style="background:var(--fa-success-bg);color:#065F46;">
    <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
    <span th:text="${sucesso}"></span>
  </div>
  <div th:if="${erro}" class="alert alert-danger fa-alert mb-3" role="alert"
       style="background:var(--fa-danger-bg);color:#991B1B;">
    <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
    <span th:text="${erro}"></span>
  </div>

  <section class="fa-card">
    <div class="table-responsive">
      <table class="fa-table" aria-label="Lista de pedidos">
        <thead>
          <tr>
            <th>#</th>
            <th>Nº Pedido</th>
            <th class="hide-mobile">Cliente</th>
            <th class="hide-mobile">Destino</th>
            <th>Volume</th>
            <th class="hide-mobile">Veículo</th>
            <th>Status</th>
            <th class="hide-mobile">Data</th>
            <th aria-label="Ações"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${pedidos.isEmpty()}">
            <td colspan="9" class="text-center py-5 text-muted">
              <i class="bi bi-inbox" style="font-size:2.5rem;display:block;margin-bottom:12px;" aria-hidden="true"></i>
              Nenhum pedido cadastrado.
              <a th:href="@{/pedidos/novo}" class="d-block mt-2">Criar primeiro pedido</a>
            </td>
          </tr>
          <tr th:each="p : ${pedidos}">
            <td class="text-muted fw-600" th:text="${p.id}"></td>
            <td class="fw-600" th:text="${p.numeroPedido ?: '—'}"></td>
            <td class="hide-mobile" th:text="${p.cliente?.nome ?: '—'}"></td>
            <td class="hide-mobile"
                th:text="${p.cidadeDestino != null ? p.cidadeDestino.nome+'/'+p.cidadeDestino.estado : '—'}"></td>
            <td th:text="${#numbers.formatDecimal(p.volumeTotalM3,1,3)+' m³'}"></td>
            <td class="hide-mobile">
              <span th:if="${p.veiculoConfirmado != null}"
                    class="badge bg-primary rounded-pill"
                    th:text="${p.veiculoConfirmado.descricao}"></span>
              <span th:if="${p.veiculoConfirmado == null and p.veiculoSugerido != null}"
                    class="badge bg-secondary rounded-pill"
                    th:text="${p.veiculoSugerido.descricao+'*'}"></span>
            </td>
            <td>
              <span class="badge-status"
                    th:classappend="'badge-'+${#strings.toLowerCase(p.status.name())}"
                    th:text="${p.status.name().replace('_',' ')}"></span>
            </td>
            <td class="hide-mobile text-muted"
                th:text="${#temporals.format(p.criadoEm,'dd/MM/yy')}"></td>
            <td>
              <div class="d-flex gap-1 align-items-center">
                <a th:href="@{/pedidos/{id}(id=${p.id})}"
                   class="btn btn-sm btn-outline-secondary rounded-pill"
                   title="Ver detalhes" aria-label="Ver detalhes do pedido">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </a>
                <a th:if="${p.status.name() == 'PROPOSTA_GERADA'}"
                   th:href="@{/pedidos/{id}/download-proposta(id=${p.id})}"
                   class="btn btn-sm btn-outline-success rounded-pill"
                   title="Baixar proposta" aria-label="Baixar proposta PDF">
                  <i class="bi bi-download" aria-hidden="true"></i>
                </a>
                <form th:action="@{/pedidos/{id}/excluir(id=${p.id})}"
                      method="post" class="d-inline"
                      th:id="'form-excluir-'+${p.id}">
                  <button type="button"
                          class="btn btn-sm btn-outline-danger rounded-pill"
                          title="Excluir pedido"
                          th:data-pedido-id="${p.id}"
                          th:data-cliente="${p.cliente?.nome ?: 'Sem cliente'}"
                          onclick="ListaPedidos.confirmarExcluir(this)"
                          aria-label="Excluir pedido">
                    <i class="bi bi-trash3" aria-hidden="true"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginação -->
    <nav th:if="${pedidos.totalPages > 1}" class="mt-3" aria-label="Paginação">
      <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${pedidos.first} ? 'disabled'">
          <a class="page-link" th:href="@{/pedidos(page=${pedidos.number-1})}"
             aria-label="Página anterior">Anterior</a>
        </li>
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, pedidos.totalPages-1)}"
            th:classappend="${i == pedidos.number} ? 'active'"
            th:attr="aria-current=${i == pedidos.number} ? 'page' : null">
          <a class="page-link"
             th:href="@{/pedidos(page=${i})}"
             th:text="${i+1}"></a>
        </li>
        <li class="page-item" th:classappend="${pedidos.last} ? 'disabled'">
          <a class="page-link" th:href="@{/pedidos(page=${pedidos.number+1})}"
             aria-label="Próxima página">Próxima</a>
        </li>
      </ul>
    </nav>
  </section>
</main>

<!-- Modal de confirmação -->
<div class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="modalExcluirTitulo" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
    <div class="modal-content">
      <div class="modal-body p-4 text-center">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--fa-danger-bg);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;" aria-hidden="true">
          <i class="bi bi-trash3-fill" style="font-size:1.4rem;color:var(--fa-danger);"></i>
        </div>
        <h5 id="modalExcluirTitulo" class="mb-2">Excluir pedido?</h5>
        <p id="modalExcluirTexto" class="text-muted mb-4" style="font-size:.9rem;">
          Esta ação não pode ser desfeita.
        </p>
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnConfirmarExcluir"
                  class="btn btn-danger rounded-pill px-4 fw-600"
                  onclick="ListaPedidos.executarExcluir()">
            <i class="bi bi-trash3 me-1" aria-hidden="true"></i> Excluir
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ──────────────────────────────────────────────────────
   ListaPedidos — módulo encapsulado
   ────────────────────────────────────────────────────── */
const ListaPedidos = (() => {
  let _pedidoIdAlvo = null;
  let _modal        = null;

  function _init() {
    const el = document.getElementById('modalExcluir');
    if (el) _modal = bootstrap.Modal.getOrCreateInstance(el);
  }

  /** Abre modal de confirmação */
  function confirmarExcluir(btn) {
    _pedidoIdAlvo   = btn.dataset.pedidoId;
    const cliente   = btn.dataset.cliente || 'Sem cliente';
    const texto     = document.getElementById('modalExcluirTexto');

    if (texto) {
      texto.textContent =
        `Você está prestes a excluir o pedido #${_pedidoIdAlvo}` +
        (cliente && cliente !== 'Sem cliente' ? ` (${cliente})` : '') +
        '. Esta ação não pode ser desfeita.';
    }
    _modal?.show();
  }

  /** Submete o form correspondente */
  function executarExcluir() {
    if (!_pedidoIdAlvo) return;

    const btn  = document.getElementById('btnConfirmarExcluir');
    const form = document.getElementById(`form-excluir-${_pedidoIdAlvo}`);

    if (btn) {
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Excluindo…';
      btn.disabled  = true;
    }
    form?.submit();
  }

  document.addEventListener('DOMContentLoaded', _init);

  return { confirmarExcluir, executarExcluir };
})();
</script>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
