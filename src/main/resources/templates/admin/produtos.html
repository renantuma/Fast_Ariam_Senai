<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
  <title>Produtos — Fast Ariam</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: overlay}"></div>

<header id="topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="topbar-menu-btn" type="button"
            onclick="FastAriam.sidebar.toggle()" aria-label="Abrir menu">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <span class="topbar-title">
      <i class="bi bi-box-seam-fill text-fa-blue" aria-hidden="true"></i>
      Catálogo de Produtos
    </span>
  </div>
  <div class="topbar-actions">
    <button class="btn-fa" data-bs-toggle="modal" data-bs-target="#modalProduto"
            onclick="ProdutosAdmin.novo()">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      <span class="btn-label">Novo Produto</span>
    </button>
  </div>
</header>

<main id="main">
  <div th:if="${sucesso}" class="fa-alert alert alert-success mb-3" role="alert"
       style="background:var(--fa-success-bg);color:#065F46;">
    <i class="bi bi-check-circle me-2" aria-hidden="true"></i>
    <span th:text="${sucesso}"></span>
  </div>

  <!-- Filtros -->
  <section class="fa-card mb-3">
    <form th:action="@{/admin/produtos}" method="get" class="fa-form">
      <div class="d-flex gap-3 align-items-end flex-wrap">
        <div>
          <label class="form-label" for="filtroTipo">Tipo</label>
          <select id="filtroTipo" name="tipo" class="form-select form-select-sm" style="min-width:160px;">
            <option value="">Todos</option>
            <option th:each="t : ${tipos}" th:value="${t.name()}"
                    th:text="${t.name().replace('_',' ')}"
                    th:selected="${param.tipo != null and param.tipo[0] == t.name()}"></option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filtroTermo">Buscar</label>
          <input type="text" id="filtroTermo" name="termo"
                 class="form-control form-control-sm"
                 placeholder="código, descrição…"
                 style="min-width:220px;" th:value="${param.termo}"/>
        </div>
        <button type="submit" class="btn-fa btn-sm">
          <i class="bi bi-search me-1" aria-hidden="true"></i> Filtrar
        </button>
        <a th:href="@{/admin/produtos}"
           class="btn btn-sm btn-outline-secondary rounded-pill">Limpar</a>
      </div>
    </form>
  </section>

  <section class="fa-card">
    <p class="text-muted mb-2" style="font-size:.82rem;"
       th:text="${produtos.size() + ' produto(s) encontrado(s)'}"></p>
    <div class="table-responsive">
      <table class="fa-table" aria-label="Tabela de produtos">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th class="hide-mobile">Tipo</th>
            <th class="hide-mobile">Categoria / Dimensões</th>
            <th class="hide-mobile">Fator / Vol. Unit.</th>
            <th>Status</th>
            <th aria-label="Ações"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${produtos}">
            <td><code th:text="${p.codigo}"></code></td>
            <td>
              <div class="fw-600" th:text="${p.descricao}"></div>
              <div th:if="${p.nomeAntigo}" class="text-muted" style="font-size:.75rem;">
                Antigo: <span th:text="${p.nomeAntigo}"></span>
              </div>
            </td>
            <td class="hide-mobile">
              <span th:if="${p.tipo.name() == 'REFRIGERADO'}" class="badge bg-info text-dark">Refrigerado</span>
              <span th:if="${p.tipo.name() == 'LINHA_SECA'}"  class="badge bg-success">Linha Seca</span>
            </td>
            <td class="hide-mobile" style="font-size:.82rem;">
              <span th:if="${p.tipo.name() == 'LINHA_SECA'}"
                    th:text="${p.categoria?.descricao ?: '—'}"></span>
              <span th:if="${p.tipo.name() == 'REFRIGERADO'}"
                    th:text="${(p.comprimento ?: 0)+'m × '+(p.largura ?: 0)+'m × '+(p.altura ?: 0)+'m'}"></span>
            </td>
            <td class="hide-mobile" style="font-size:.88rem;">
              <span th:if="${p.tipo.name() == 'LINHA_SECA'}"
                    th:text="${p.fatorQtdM3 + ' pç/m³'}"></span>
              <span th:if="${p.tipo.name() == 'REFRIGERADO'}"
                    th:text="${#numbers.formatDecimal(p.volumeUnitario,1,3)+' m³'}"></span>
            </td>
            <td>
              <span th:if="${p.ativo}"    class="badge bg-success">Ativo</span>
              <span th:unless="${p.ativo}" class="badge bg-secondary">Inativo</span>
            </td>
            <td>
              <div class="d-flex gap-1">
                <button class="btn btn-sm btn-outline-primary rounded-pill"
                        th:data-id="${p.id}"
                        th:data-codigo="${p.codigo}"
                        th:data-descricao="${p.descricao}"
                        th:data-tipo="${p.tipo.name()}"
                        data-bs-toggle="modal"
                        data-bs-target="#modalProduto"
                        onclick="ProdutosAdmin.editar(this)"
                        aria-label="Editar produto">
                  <i class="bi bi-pencil" aria-hidden="true"></i>
                </button>
                <form th:action="@{/admin/produtos/{id}/toggle(id=${p.id})}"
                      method="post" class="d-inline">
                  <button type="submit"
                          class="btn btn-sm rounded-pill"
                          th:classappend="${p.ativo} ? 'btn-outline-warning' : 'btn-outline-success'"
                          th:title="${p.ativo} ? 'Desativar' : 'Ativar'"
                          th:aria-label="${p.ativo} ? 'Desativar produto' : 'Ativar produto'">
                    <i th:classappend="${p.ativo} ? 'bi bi-pause' : 'bi bi-play'"
                       class="bi" aria-hidden="true"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- Modal Produto -->
<div class="modal fade" id="modalProduto" tabindex="-1"
     aria-labelledby="modalProdutoTitulo" aria-modal="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background:var(--fa-blue);color:#fff;">
        <h5 class="modal-title" id="modalProdutoTitulo">Novo Produto</h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form th:action="@{/admin/produtos/salvar}" method="post" class="fa-form">
        <input type="hidden" name="id" id="prodId"/>
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="prodCodigo">Código *</label>
              <input type="text" id="prodCodigo" name="codigo"
                     class="form-control" required placeholder="LSG-GOND-01"/>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="prodDesc">Descrição *</label>
              <input type="text" id="prodDesc" name="descricao"
                     class="form-control" required placeholder="Gondola 1,25m Dupla Face"/>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="prodNomeAntigo">Nome Antigo (mapeamento PDF)</label>
              <input type="text" id="prodNomeAntigo" name="nomeAntigo"
                     class="form-control" placeholder="Nome no PDF legado"/>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="prodTipo">Tipo *</label>
              <select id="prodTipo" name="tipo" class="form-select"
                      onchange="ProdutosAdmin.toggleCampos(this.value)" required>
                <option value="">— selecionar —</option>
                <option th:each="t : ${tipos}"
                        th:value="${t.name()}"
                        th:text="${t.name().replace('_',' ')}"></option>
              </select>
            </div>

            <!-- Campos Linha Seca -->
            <div id="camposLinhaSeca" class="col-12 d-none">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Categoria</label>
                  <select name="categoria" class="form-select">
                    <option value="">— selecionar —</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.name()}"
                            th:text="${c.descricao + ' (fator: ' + c.fatorAjuste + 'x)'}"></option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Fator Qtd/m³ *</label>
                  <input type="number" name="fatorQtdM3"
                         class="form-control" step="0.01" min="0.01"
                         placeholder="Peças por m³"/>
                </div>
              </div>
            </div>

            <!-- Campos Refrigerado -->
            <div id="camposRefrigerado" class="col-12 d-none">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">Comprimento (m) *</label>
                  <input type="number" name="comprimento"
                         class="form-control" step="0.01" placeholder="Ex: 1.56"/>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Largura (m) *</label>
                  <input type="number" name="largura"
                         class="form-control" step="0.01" placeholder="Ex: 1.20"/>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Altura (m) *</label>
                  <input type="number" name="altura"
                         class="form-control" step="0.01" placeholder="Ex: 1.72"/>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer px-4 pb-4">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-fa px-5">
            <i class="bi bi-floppy me-1" aria-hidden="true"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/* ──────────────────────────────────────────────────────
   ProdutosAdmin — módulo encapsulado
   ────────────────────────────────────────────────────── */
const ProdutosAdmin = (() => {
  /** Exibe/oculta campos conforme tipo de produto selecionado */
  function toggleCampos(tipo) {
    const lsEl = document.getElementById('camposLinhaSeca');
    const rfEl = document.getElementById('camposRefrigerado');
    if (lsEl) lsEl.classList.toggle('d-none', tipo !== 'LINHA_SECA');
    if (rfEl) rfEl.classList.toggle('d-none', tipo !== 'REFRIGERADO');
  }

  /** Prepara modal para criar novo produto */
  function novo() {
    _setModalTitle('Novo Produto');
    _clearForm();
    toggleCampos('');
  }

  /** Prepara modal para editar produto existente */
  function editar(btn) {
    const { id, codigo, descricao, tipo } = btn.dataset;
    _setModalTitle('Editar Produto');
    document.getElementById('prodId').value     = id;
    document.getElementById('prodCodigo').value = codigo;
    document.getElementById('prodDesc').value   = descricao;
    document.getElementById('prodTipo').value   = tipo;
    toggleCampos(tipo);
  }

  function _setModalTitle(title) {
    const el = document.getElementById('modalProdutoTitulo');
    if (el) el.textContent = title;
  }

  function _clearForm() {
    ['prodId','prodCodigo','prodDesc','prodTipo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }

  return { toggleCampos, novo, editar };
})();
</script>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
