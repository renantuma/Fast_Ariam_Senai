<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Entrar — Fast Ariam Logística</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root {
      --blue:       #00478D;
      --blue-dk:    #002F60;
      --orange:     #E85D20;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--blue-dk);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Background decorativo */
    .bg-deco {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .bg-deco::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,71,141,.6) 0%, transparent 70%);
      top: -200px; left: -200px;
    }
    .bg-deco::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,93,32,.2) 0%, transparent 65%);
      bottom: -150px; right: -100px;
    }
    .bg-deco-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Card login */
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,.3);
      position: relative; z-index: 1;
      animation: slideUp .4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-brand-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--orange);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: #fff;
      box-shadow: 0 6px 18px rgba(232,93,32,.4);
      margin-bottom: 14px;
    }
    .login-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.6rem; font-weight: 800;
      color: var(--blue); margin-bottom: 4px;
      letter-spacing: -.03em;
    }
    .login-sub {
      color: #6B7280; font-size: .88rem; margin-bottom: 32px;
    }

    .form-label {
      font-size: .75rem; font-weight: 700;
      color: #6B7280; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 5px; display: block;
    }
    .form-control {
      border: 1.5px solid #DDE3EE;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: .95rem;
      font-family: 'Nunito', sans-serif;
      transition: border-color .18s, box-shadow .18s;
      width: 100%;
    }
    .form-control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,71,141,.12);
      outline: none;
    }

    .btn-login {
      background: var(--blue);
      color: #fff; border: none; border-radius: 10px;
      padding: 13px; font-weight: 700; font-size: 1rem;
      width: 100%; cursor: pointer; font-family: 'Nunito', sans-serif;
      transition: background .18s, box-shadow .18s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover {
      background: var(--blue-dk);
      box-shadow: 0 6px 20px rgba(0,71,141,.3);
      transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); }

    .alert {
      border-radius: 10px; font-size: .88rem; border: none;
      display: flex; align-items: center; gap: 8px;
    }

    .login-footer {
      text-align: center; color: #9CA3AF;
      font-size: .75rem; margin-top: 28px;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .login-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="bg-deco" aria-hidden="true">
  <div class="bg-deco-grid"></div>
</div>

<main class="login-card">
  <!-- Marca -->
  <div class="text-center">
    <div class="login-brand-icon mx-auto" aria-hidden="true">
      <i class="bi bi-truck-front-fill"></i>
    </div>
    <h1 class="login-title">Fast Ariam</h1>
    <p class="login-sub">Sistema de Logística e Orçamentação</p>
  </div>

  <!-- Alertas -->
  <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert">
    <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
    <span>Usuário ou senha inválidos. Tente novamente.</span>
  </div>
  <div th:if="${param.logout}" class="alert alert-success mb-3" role="alert">
    <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
    <span>Sessão encerrada com sucesso.</span>
  </div>

  <!-- Formulário -->
  <form th:action="@{/login}" method="post" novalidate>
    <div class="mb-3">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" id="username" name="username"
             class="form-control" placeholder="seu.usuario"
             autofocus autocomplete="username" required/>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Senha</label>
      <input type="password" id="password" name="password"
             class="form-control" placeholder="••••••••"
             autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn-login">
      Entrar <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </button>
  </form>

  <p class="login-footer">Fast Ariam Equipamentos · Londrina / PR</p>
</main>

</body>
</html>
