<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo != null ? titulo + ' — Fast Ariam' : 'Fast Ariam Logística'}">Fast Ariam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/main.css}" rel="stylesheet"/>
  <!--
    Aplica tema/fonte salvos ANTES do CSS pintar a tela, evitando o
    "flash" de tema claro em quem escolheu o escuro (ou vice-versa).
    Mantido minúsculo e síncrono de propósito.
  -->
  <script>
    (function () {
      try {
        var raiz = document.documentElement;
        var tema = localStorage.getItem('fa-theme') || 'light';
        if (tema === 'auto') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        raiz.setAttribute('data-theme', tema);
        raiz.setAttribute('data-font-size', localStorage.getItem('fa-font-size') || 'md');
        raiz.setAttribute('data-font-family', localStorage.getItem('fa-font-family') || 'padrao');
      } catch (e) { /* localStorage indisponível — segue com o padrão */ }
    })();
  </script>
  <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     SIDEBAR (fragmento)
     ═══════════════════════════════════════════════════════ -->
<nav id="sidebar" aria-label="Menu principal" th:fragment="sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon" aria-hidden="true">
      <i class="bi bi-truck-front-fill"></i>
    </div>
    <div class="brand-name">Fast Ariam</div>
    <div class="brand-sub">Sistema de Logística</div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Principal</div>

    <a th:href="@{/dashboard}"    class="sidebar-link" th:classappend="${activePage == 'dashboard'}   ? ' active'">
      <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i><span>Dashboard</span>
    </a>
    <a th:href="@{/pedidos/novo}" class="sidebar-link" th:classappend="${activePage == 'novo-pedido'} ? ' active'">
      <i class="bi bi-plus-circle-fill" aria-hidden="true"></i><span>Novo Pedido</span>
    </a>
    <a th:href="@{/pedidos}"      class="sidebar-link" th:classappend="${activePage == 'pedidos'}     ? ' active'">
      <i class="bi bi-file-earmark-text-fill" aria-hidden="true"></i><span>Pedidos</span>
    </a>

    <div class="sidebar-section" sec:authorize="hasRole('ADMINISTRADOR')">Cadastros</div>

    <a th:href="@{/admin/produtos}" class="sidebar-link"
       sec:authorize="hasRole('ADMINISTRADOR')"
       th:classappend="${activePage == 'produtos'} ? ' active'">
      <i class="bi bi-box-seam-fill" aria-hidden="true"></i><span>Produtos</span>
    </a>
    <a th:href="@{/admin/clientes}" class="sidebar-link"
       sec:authorize="hasRole('ADMINISTRADOR')"
       th:classappend="${activePage == 'clientes'} ? ' active'">
      <i class="bi bi-people-fill" aria-hidden="true"></i><span>Clientes</span>
    </a>
    <a th:href="@{/admin/cidades}"  class="sidebar-link"
       sec:authorize="hasRole('ADMINISTRADOR')"
       th:classappend="${activePage == 'cidades'}  ? ' active'">
      <i class="bi bi-geo-alt-fill" aria-hidden="true"></i><span>Cidades</span>
    </a>

    <div class="sidebar-section" sec:authorize="hasRole('ADMINISTRADOR')">Admin</div>

    <a th:href="@{/admin/configuracao}" class="sidebar-link"
       sec:authorize="hasRole('ADMINISTRADOR')"
       th:classappend="${activePage == 'config'} ? ' active'">
      <i class="bi bi-sliders2-vertical" aria-hidden="true"></i><span>Configuração</span>
    </a>
    <a th:href="@{/admin/usuarios}" class="sidebar-link"
       sec:authorize="hasRole('ADMINISTRADOR')"
       th:classappend="${activePage == 'usuarios'} ? ' active'">
      <i class="bi bi-person-gear" aria-hidden="true"></i><span>Usuários</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" aria-hidden="true">
        <i class="bi bi-person-fill" style="color:rgba(255,255,255,.7);font-size:.95rem;"></i>
      </div>
      <div>
        <div class="sidebar-user-name" sec:authentication="name">Usuário</div>
        <div class="sidebar-user-role" sec:authorize="hasRole('ADMINISTRADOR')">Administrador</div>
        <div class="sidebar-user-role" sec:authorize="hasRole('OPERADOR')">Operador</div>
      </div>
    </div>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-logout">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sair da conta</span>
      </button>
    </form>
  </div>
</nav>

<!-- ═══════════════════════════════════════════════════════
     OVERLAY + BOTÃO MOBILE (fragmento)
     ═══════════════════════════════════════════════════════ -->
<th:block th:fragment="overlay">
  <div id="sidebarOverlay" onclick="FastAriam.sidebar.close()" aria-hidden="true"></div>
  <button type="button" class="mobile-layout-btn" onclick="FastAriam.sidebar.toggle()" aria-label="Abrir menu">
    <i class="bi bi-list" aria-hidden="true"></i><span>Menu</span>
  </button>
</th:block>

<!-- ═══════════════════════════════════════════════════════
     SCRIPTS GLOBAIS (fragmento) — incluir antes de </body>
     ═══════════════════════════════════════════════════════ -->
<th:block th:fragment="scripts">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Namespace global FastAriam — padrão Módulo (POO) -->
  <script>
    window.FastAriam = (function () {
      'use strict';

      /* ── Sidebar ──────────────────────────────── */
      var sidebar = (function () {
        function el()      { return document.getElementById('sidebar'); }
        function overlay() { return document.getElementById('sidebarOverlay'); }
        function isMobile(){ return window.matchMedia('(max-width: 768px)').matches; }

        function open() {
          var s = el(), o = overlay();
          if (!s) return;
          s.classList.add('open');
          if (o) o.style.display = 'block';
          document.body.style.overflow = 'hidden';
        }
        function close() {
          var s = el(), o = overlay();
          if (!s) return;
          s.classList.remove('open');
          if (o) o.style.display = 'none';
          document.body.style.overflow = '';
        }
        function toggle() {
          var s = el();
          if (!s) return;
          if (s.classList.contains('open')) { close(); } else { open(); }
        }

        window.addEventListener('resize', function () { if (!isMobile()) close(); }, { passive: true });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

        return { open: open, close: close, toggle: toggle };
      })();

      /* ── Tema / Aparência ─────────────────────── */
      var theme = (function () {
        var CHAVE_TEMA   = 'fa-theme';        // 'light' | 'dark' | 'auto'
        var CHAVE_TAM    = 'fa-font-size';    // 'sm' | 'md' | 'lg'
        var CHAVE_FONTE  = 'fa-font-family';  // 'padrao' | 'sistema'
        var ESCALA = { sm: 0.9, md: 1, lg: 1.15 };

        function ler(chave, padrao) {
          try { return localStorage.getItem(chave) || padrao; } catch (e) { return padrao; }
        }
        function salvar(chave, valor) {
          try { localStorage.setItem(chave, valor); } catch (e) { /* modo privado etc */ }
        }

        function resolverTemaEfetivo(valor) {
          if (valor === 'auto') {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          return valor;
        }

        function aplicar() {
          var raiz = document.documentElement;
          raiz.setAttribute('data-theme', resolverTemaEfetivo(ler(CHAVE_TEMA, 'light')));
          raiz.setAttribute('data-font-size', ler(CHAVE_TAM, 'md'));
          raiz.setAttribute('data-font-family', ler(CHAVE_FONTE, 'padrao'));
          document.documentElement.style.setProperty('--fa-font-scale', ESCALA[ler(CHAVE_TAM, 'md')] || 1);
          // Habilita transições suaves só depois da 1ª pintura, pra não animar o carregamento inicial.
          requestAnimationFrame(function () { document.body.classList.add('fa-theme-ready'); });
        }

        function setTema(valor)   { salvar(CHAVE_TEMA, valor);  aplicar(); }
        function setTamanho(valor){ salvar(CHAVE_TAM, valor);   aplicar(); }
        function setFonte(valor)  { salvar(CHAVE_FONTE, valor); aplicar(); }

        function restaurarPadrao() {
          salvar(CHAVE_TEMA, 'light');
          salvar(CHAVE_TAM, 'md');
          salvar(CHAVE_FONTE, 'padrao');
          aplicar();
        }

        function preferencias() {
          return { tema: ler(CHAVE_TEMA, 'light'), tamanho: ler(CHAVE_TAM, 'md'), fonte: ler(CHAVE_FONTE, 'padrao') };
        }

        // Se o usuário escolheu "Automático", reage à mudança do SO em tempo real.
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (ler(CHAVE_TEMA, 'light') === 'auto') aplicar();
          });
        }

        document.addEventListener('DOMContentLoaded', aplicar);

        return { setTema: setTema, setTamanho: setTamanho, setFonte: setFonte,
                 restaurarPadrao: restaurarPadrao, preferencias: preferencias, aplicar: aplicar };
      })();

      /* ── Toast ───────────────────────────────── */
      var toast = (function () {
        function show(message, type) {
          type = type || 'info';
          var box = document.createElement('div');
          box.className = 'alert alert-' + type + ' fa-alert';
          box.style.cssText = 'position:fixed;top:76px;right:20px;z-index:9999;min-width:260px;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,.14)';
          var icon = (type === 'success') ? 'check-circle-fill' : 'exclamation-circle-fill';
          box.innerHTML = '<i class="bi bi-' + icon + '"></i><span>' + message + '</span>';
          document.body.appendChild(box);
          setTimeout(function () { box.remove(); }, 4000);
        }
        return { show: show };
      })();

      return { sidebar: sidebar, toast: toast, theme: theme };
    })();

    /* Aliases de compatibilidade (templates antigos) */
    window.toggleSidebar      = function (fc) { return fc === true ? FastAriam.sidebar.close() : FastAriam.sidebar.toggle(); };
    window.toggleMobileLayout = function () { return FastAriam.sidebar.toggle(); };
  </script>
</th:block>

</body>
</html>
