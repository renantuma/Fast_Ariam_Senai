spring.application.name=Fast Ariam Logistica

# Database MySQL
# Usuário/senha podem ser sobrescritos por variáveis de ambiente (DB_USERNAME / DB_PASSWORD).
spring.datasource.url=jdbc:mysql://localhost:3306/fastariam?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:SQLADMIN}
spring.datasource.password=${DB_PASSWORD:SQLADMIN123}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.fastariam=INFO
logging.level.org.springframework.security=WARN

# App config
app.upload.dir=./uploads
app.origem.cidade=Londrina
app.origem.estado=PR
# Google Maps API key (configure antes de usar)
app.googlemaps.api-key=${GOOGLE_MAPS_API_KEY:SUA_CHAVE_AQUI}

server.port=8080
