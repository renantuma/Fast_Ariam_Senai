spring.application.name=Fast Ariam Logistica

# Database H2
spring.datasource.url=jdbc:h2:file:./data/fastariam;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.fastariam=INFO
logging.level.org.springframework.security=WARN

# App config
app.upload.dir=./uploads
app.origem.cidade=Londrina
app.origem.estado=PR
# Google Maps API key (configure antes de usar)
app.googlemaps.api-key=${GOOGLE_MAPS_API_KEY:SUA_CHAVE_AQUI}

server.port=8080
