<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — Fast Ariam Logística</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #00478D; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; }
    .login-wrap {
      background: #fff; border-radius: 20px; padding: 48px 44px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    .login-logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.7rem; font-weight: 700;
      color: #00478D; margin-bottom: 4px; }
    .login-sub { color: #6B7280; font-size: .88rem; margin-bottom: 32px; }
    .form-label { font-size: .78rem; font-weight: 600; color: #6B7280; text-transform: uppercase;
      letter-spacing: .05em; margin-bottom: 5px; }
    .form-control { border: 1.5px solid #E2E6EF; border-radius: 10px; padding: 11px 14px;
      font-size: .95rem; transition: all .15s; }
    .form-control:focus { border-color: #00478D; box-shadow: 0 0 0 3px rgba(0,71,141,.12); }
    .btn-login { background: #00478D; color: #fff; border: none; border-radius: 10px;
      padding: 12px; font-weight: 700; font-size: 1rem; width: 100%; transition: background .15s; }
    .btn-login:hover { background: #003166; }
    .bg-pattern {
      position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.06) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(235,94,40,.15) 0%, transparent 50%);
    }
  </style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="login-wrap">
  <div class="login-logo"><i class="bi bi-truck me-2"></i>Fast Ariam</div>
  <div class="login-sub">Sistema de Logística e Orçamentação</div>

  <div th:if="${param.error}" class="alert alert-danger py-2 mb-3" style="border-radius:10px;font-size:.88rem;">
    <i class="bi bi-exclamation-circle me-1"></i> Usuário ou senha inválidos.
  </div>
  <div th:if="${param.logout}" class="alert alert-success py-2 mb-3" style="border-radius:10px;font-size:.88rem;">
    <i class="bi bi-check-circle me-1"></i> Sessão encerrada com sucesso.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label">Usuário</label>
      <input type="text" name="username" class="form-control" placeholder="seu.usuario" autofocus required/>
    </div>
    <div class="mb-4">
      <label class="form-label">Senha</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn-login">Entrar <i class="bi bi-arrow-right ms-1"></i></button>
  </form>

  <p class="text-center text-muted mt-4 mb-0" style="font-size:.78rem;">
    Fast Ariam Equipamentos · Londrina/PR
  </p>
</div>
</body>
</html>
