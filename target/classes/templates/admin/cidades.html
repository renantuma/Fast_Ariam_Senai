<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cidades — Fast Ariam</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/main.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div id="topbar">
  <span class="topbar-title">Base de Cidades</span>
  <button class="btn-fa btn" data-bs-toggle="modal" data-bs-target="#modalCidade">
    <i class="bi bi-plus-lg me-1"></i>Nova Cidade
  </button>
</div>

<main id="main">
  <div th:if="${sucesso}" class="fa-alert alert alert-success mb-3">
    <i class="bi bi-check-circle me-2"></i><span th:text="${sucesso}"></span>
  </div>

  <form th:action="@{/admin/cidades}" method="get" class="fa-card mb-3 d-flex align-items-end gap-3">
    <div>
      <label class="form-label" style="font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;">Filtrar por Estado</label>
      <select name="estado" class="form-select form-select-sm" style="min-width:120px;">
        <option value="">Todos</option>
        <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                th:selected="${param.estado != null and param.estado[0] == e}"></option>
      </select>
    </div>
    <button type="submit" class="btn-fa btn btn-sm px-4">Filtrar</button>
    <a th:href="@{/admin/cidades}" class="btn btn-sm btn-outline-secondary rounded-pill">Limpar</a>
    <span class="ms-auto text-muted" style="font-size:.82rem;"
          th:text="${cidades.size() + ' cidade(s)'}"></span>
  </form>

  <div class="fa-card">
    <div class="table-responsive">
      <table class="fa-table">
        <thead>
          <tr>
            <th>Cidade / UF</th><th>Distância</th>
            <th>Frete/km Truck</th><th>Frete/km Carreta</th>
            <th>Pedagio Truck</th><th>Pedágio Carreta</th>
            <th>ICMS</th><th>Origem</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${cidades}">
            <td>
              <strong th:text="${c.nome}"></strong>
              <span class="badge bg-secondary ms-1" th:text="${c.estado}"></span>
            </td>
            <td th:text="${c.distanciaKm + ' km'}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.freteBaseKmTruck,1,'POINT',2,'COMMA')}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.freteBaseKmCarreta,1,'POINT',2,'COMMA')}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.pedagioTruck,1,'POINT',2,'COMMA')}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.pedagioCarreta,1,'POINT',2,'COMMA')}"></td>
            <td th:text="${c.icmsPercent + '%'}"></td>
            <td>
              <span th:if="${c.viaApi}" class="badge bg-info text-dark">API</span>
              <span th:unless="${c.viaApi}" class="badge bg-light text-dark">Manual</span>
            </td>
            <td>
              <form th:action="@{/admin/cidades/{id}/excluir(id=${c.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('Remover '+[[${c.nome}]]+'?')">
                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">
                  <i class="bi bi-trash3"></i>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal fade" id="modalCidade" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header" style="background:#00478D;color:#fff;border-radius:16px 16px 0 0;border:none;">
        <h5 class="modal-title">Nova Cidade</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form th:action="@{/admin/cidades/salvar}" method="post" class="fa-form">
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Nome da Cidade *</label>
              <input type="text" name="nome" class="form-control" required placeholder="Ex: Maringá"/></div>
            <div class="col-md-4"><label class="form-label">Estado (UF) *</label>
              <input type="text" name="estado" class="form-control" maxlength="2" required placeholder="PR"/></div>
            <div class="col-md-4"><label class="form-label">Distância (km) *</label>
              <input type="number" name="distanciaKm" class="form-control" step="1" min="0" required/></div>
            <div class="col-md-4"><label class="form-label">Frete/km Truck (R$) *</label>
              <input type="number" name="freteBaseKmTruck" class="form-control" step="0.01" required value="4.50"/></div>
            <div class="col-md-4"><label class="form-label">Frete/km Carreta (R$) *</label>
              <input type="number" name="freteBaseKmCarreta" class="form-control" step="0.01" required value="5.80"/></div>
            <div class="col-md-4"><label class="form-label">Pedágio Truck (R$)</label>
              <input type="number" name="pedagioTruck" class="form-control" step="0.01" value="0"/></div>
            <div class="col-md-4"><label class="form-label">Pedágio Carreta (R$)</label>
              <input type="number" name="pedagioCarreta" class="form-control" step="0.01" value="0"/></div>
            <div class="col-md-4"><label class="form-label">ICMS % *</label>
              <input type="number" name="icmsPercent" class="form-control" step="0.01" required value="7.0"/></div>
          </div>
        </div>
        <div class="modal-footer border-0 px-4 pb-4">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-fa btn px-5">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
