<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Proposta Gerada — Fast Ariam</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/main.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div id="topbar"><span class="topbar-title">Proposta Gerada</span></div>

<main id="main">
  <div class="text-center py-5">
    <div style="width:80px;height:80px;border-radius:50%;background:#ECFDF5;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;">
      <i class="bi bi-check-lg" style="font-size:2.5rem;color:#059669;"></i>
    </div>
    <h2 style="font-family:'Space Grotesk',sans-serif;">Proposta gerada com sucesso!</h2>
    <p class="text-muted">O PDF foi gerado e está pronto para download e envio ao cliente.</p>

    <div class="d-flex gap-3 justify-content-center mt-4">
      <a th:href="@{/pedidos/{id}/download-proposta(id=${pedido.id})}"
         class="btn-fa-orange btn px-4 d-inline-flex align-items-center gap-2">
        <i class="bi bi-download"></i> Baixar Proposta PDF
      </a>
      <a th:href="@{/pedidos/novo}" class="btn-fa btn px-4 d-inline-flex align-items-center gap-2">
        <i class="bi bi-plus-lg"></i> Novo Pedido
      </a>
      <a th:href="@{/pedidos}" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-list-ul me-1"></i> Ver Todos os Pedidos
      </a>
    </div>

    <div class="fa-card mt-5 text-start" style="max-width:500px;margin:28px auto 0;">
      <div class="fa-card-title mb-3">Detalhes do Pedido</div>
      <table class="fa-table">
        <tr><td class="text-muted">Nº Pedido</td><td th:text="${pedido.numeroPedido ?: '—'}"></td></tr>
        <tr><td class="text-muted">Cliente</td><td th:text="${pedido.cliente?.nome ?: '—'}"></td></tr>
        <tr><td class="text-muted">Destino</td>
          <td th:text="${pedido.cidadeDestino != null ? pedido.cidadeDestino.nome+'/'+pedido.cidadeDestino.estado : '—'}"></td></tr>
        <tr><td class="text-muted">Volume</td><td th:text="${#numbers.formatDecimal(pedido.volumeTotalM3,1,3)+' m³'}"></td></tr>
        <tr><td class="text-muted">Veículo</td>
          <td th:text="${pedido.veiculoConfirmado?.descricao ?: pedido.veiculoSugerido?.descricao ?: '—'}"></td></tr>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
