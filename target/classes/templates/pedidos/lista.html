<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pedidos — Fast Ariam</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/main.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div id="topbar">
  <span class="topbar-title">Pedidos</span>
  <a th:href="@{/pedidos/novo}" class="btn-fa-orange btn d-flex align-items-center gap-2">
    <i class="bi bi-plus-lg"></i> Novo Pedido
  </a>
</div>

<main id="main">

  <!-- Mensagens de feedback -->
  <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center gap-2 mb-3 rounded-3" style="border:none;background:#ECFDF5;color:#065F46;">
    <i class="bi bi-check-circle-fill"></i>
    <span th:text="${sucesso}"></span>
  </div>
  <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 rounded-3" style="border:none;background:#FEF2F2;color:#991B1B;">
    <i class="bi bi-exclamation-circle-fill"></i>
    <span th:text="${erro}"></span>
  </div>

  <div class="fa-card">
    <div class="table-responsive">
      <table class="fa-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nº Pedido</th>
            <th>Cliente</th>
            <th>Destino</th>
            <th>Volume</th>
            <th>Veículo</th>
            <th>Status</th>
            <th>Data</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${pedidos.isEmpty()}">
            <td colspan="9" class="text-center py-5 text-muted">
              Nenhum pedido cadastrado.
              <a th:href="@{/pedidos/novo}">Criar primeiro pedido</a>
            </td>
          </tr>
          <tr th:each="p : ${pedidos}">
            <td class="text-muted" th:text="${p.id}"></td>
            <td th:text="${p.numeroPedido ?: '—'}"></td>
            <td th:text="${p.cliente?.nome ?: '—'}"></td>
            <td th:text="${p.cidadeDestino != null ? p.cidadeDestino.nome+'/'+p.cidadeDestino.estado : '—'}"></td>
            <td th:text="${#numbers.formatDecimal(p.volumeTotalM3,1,3)+' m³'}"></td>
            <td>
              <span th:if="${p.veiculoConfirmado != null}" class="badge bg-primary rounded-pill"
                    th:text="${p.veiculoConfirmado.descricao}"></span>
              <span th:if="${p.veiculoConfirmado == null and p.veiculoSugerido != null}"
                    class="badge bg-secondary rounded-pill"
                    th:text="${p.veiculoSugerido.descricao+'*'}"></span>
            </td>
            <td>
              <span class="badge-status"
                    th:classappend="'badge-'+${#strings.toLowerCase(p.status.name())}"
                    th:text="${p.status.name().replace('_',' ')}"></span>
            </td>
            <td class="text-muted" th:text="${#temporals.format(p.criadoEm,'dd/MM/yy')}"></td>
            <td>
              <div class="d-flex gap-1 align-items-center">
                <!-- Ver detalhes -->
                <a th:href="@{/pedidos/{id}(id=${p.id})}"
                   class="btn btn-sm btn-outline-secondary rounded-pill"
                   title="Ver detalhes">
                  <i class="bi bi-eye"></i>
                </a>

                <!-- Download proposta -->
                <a th:if="${p.status.name() == 'PROPOSTA_GERADA'}"
                   th:href="@{/pedidos/{id}/download-proposta(id=${p.id})}"
                   class="btn btn-sm btn-outline-success rounded-pill"
                   title="Baixar proposta">
                  <i class="bi bi-download"></i>
                </a>

                <!-- Excluir -->
                <form th:action="@{/pedidos/{id}/excluir(id=${p.id})}"
                      method="post"
                      class="d-inline"
                      th:id="'form-excluir-'+${p.id}">
                  <button type="button"
                          class="btn btn-sm btn-outline-danger rounded-pill"
                          title="Excluir pedido"
                          th:onclick="'confirmarExcluir(' + ${p.id} + ', \'Sem cliente\')'">
                    <i class="bi bi-trash3"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Paginação -->
    <nav th:if="${pedidos.totalPages > 1}" class="mt-3">
      <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${pedidos.first} ? 'disabled'">
          <a class="page-link" th:href="@{/pedidos(page=${pedidos.number-1})}">Anterior</a>
        </li>
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, pedidos.totalPages-1)}"
            th:classappend="${i == pedidos.number} ? 'active'">
          <a class="page-link" th:href="@{/pedidos(page=${i})}" th:text="${i+1}"></a>
        </li>
        <li class="page-item" th:classappend="${pedidos.last} ? 'disabled'">
          <a class="page-link" th:href="@{/pedidos(page=${pedidos.number+1})}">Próxima</a>
        </li>
      </ul>
    </nav>
  </div>
</main>

<!-- Modal de confirmação de exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-body p-4 text-center">
        <div style="width:56px;height:56px;border-radius:50%;background:#FEF2F2;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <i class="bi bi-trash3-fill" style="font-size:1.4rem;color:#DC2626;"></i>
        </div>
        <h5 style="font-family:'Space Grotesk',sans-serif;font-weight:700;margin-bottom:8px;">Excluir pedido?</h5>
        <p id="modalExcluirTexto" class="text-muted mb-4" style="font-size:.9rem;">
          Esta ação não pode ser desfeita.
        </p>
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" id="btnConfirmarExcluir"
                  class="btn btn-danger rounded-pill px-4 fw-600"
                  onclick="executarExcluir()">
            <i class="bi bi-trash3 me-1"></i> Excluir
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let pedidoIdParaExcluir = null;
const modalExcluir = new bootstrap.Modal(document.getElementById('modalExcluir'));

function confirmarExcluir(id, clienteNome) {
  pedidoIdParaExcluir = id;
  document.getElementById('modalExcluirTexto').textContent =
    'Você está prestes a excluir o pedido #' + id +
    (clienteNome && clienteNome !== 'Sem cliente' ? ' (' + clienteNome + ')' : '') +
    '. Esta ação não pode ser desfeita.';
  modalExcluir.show();
}

function executarExcluir() {
  if (!pedidoIdParaExcluir) return;
  document.getElementById('btnConfirmarExcluir').innerHTML =
    '<span class="spinner-border spinner-border-sm me-1"></span> Excluindo...';
  document.getElementById('btnConfirmarExcluir').disabled = true;
  document.getElementById('form-excluir-' + pedidoIdParaExcluir).submit();
}
</script>
</body>
</html>
